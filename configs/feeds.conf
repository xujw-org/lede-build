# 追加到 lede 的 feeds.conf.default 的第三方源码源。
#
# 每行一条 src-git / src-link，和官方 feeds.conf 语法一致，例如：
#   src-git openclash https://github.com/vernesong/OpenClash.git;master
#   src-git danshui   https://github.com/281677160/openwrt-package.git;master
#   src-link mypkgs   /path/to/local/packages     # 仅本地可用
#
# 生效方式：
#   1. imagebuilder 工作流在 feeds update 前把这里的有效行追加到 feeds.conf.default；
#   2. 把要从这些源编译的包名加到 configs/targets.json 的 packages 里；
#   3. 把要装进固件的包名加到 configs/firmware.json 的 packages 里。
#
# 注意：第三方源是源码 feed，会在 ImageBuilder 构建阶段编译，因此必须与 lede
# 的版本/内核兼容；修改本文件会使 ImageBuilder 缓存失效并重新编译。
#
# 注释行和空行会被忽略。
